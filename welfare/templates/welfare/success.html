<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 p-5">
                <div class="mb-3">
                    <span class="fs-1">🎉</span>
                </div>

                <!-- Display Django Flash Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'success' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% else %}
                    <h3 class="text-success mb-3">Registration Successful!</h3>
                    <p class="text-muted">Your application has been received and is currently under administrative review.</p>
                {% endif %}

                <hr class="my-4">
                
                <div>
                    <a href="{% url 'login' %}" class="btn btn-primary px-4">Proceed to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
