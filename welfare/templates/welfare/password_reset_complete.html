<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow-sm p-5 border-0">
            <h3 class="text-success mb-3">Password Updated!</h3>
            <p class="text-muted">Your password has been changed successfully. You can now log in with your new credentials.</p>
            <a href="{% url 'login' %}" class="btn btn-primary mt-3">Proceed to Login</a>
        </div>
    </div>
</div>
</body>
</html>
