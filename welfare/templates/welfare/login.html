<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-5 col-lg-4">

    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white text-center py-3">
            <h4 class="mb-0">Member Portal Login</h4>
        </div>
        <div class="card-body p-4">

            {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <!-- Forgot Password Link Added Here -->
                <div class="text-end mb-3">
                    <a href="{% url 'password_reset' %}" class="small text-decoration-none">Forgot Password?</a>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'tenant_register' %}">Register here</a></small>
            </div>

        </div>
    </div>

</div>
</div>
</div>
</body>
</html>
