<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 card shadow-sm p-4 border-0">
            <h3 class="mb-3 text-center">Reset Password</h3>
            <p class="text-muted small">Enter your email address below, and we'll send you a link to reset your password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="small text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
